<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Planning</title>
    <link rel="stylesheet" href="base.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
</head>
<body>
<script type="module">
    // for FULL view!
    const clientWidth = document.documentElement.clientWidth
    const clientHeight = document.documentElement.clientHeight

    const body = d3.select("body")
        .attr("width", clientWidth)
        .attr("height", clientHeight)
        .attr("viewBox", `0, 0, ${clientWidth}, ${clientHeight}`)
        .attr("preserveAspectRatio", "none")

    const worklogDataRaw = await d3.tsv("../02_audit_duedates/worklogs.txt")
    const auditDataRaw = await d3.tsv("../02_audit_duedates/audits.txt")
    const stepsRaw = await d3.tsv("../utils/steps.tsv")
    const steps = d3.index(stepsRaw.map(d => {
        return { ...d, id: Number(d.id), stageId: Number(d.stageId), Punkte: parseFloat(d.Punkte) }
    }), d => d.stepName)

    // because my data is so old i'm gonna pretend that "TODAY" is the 10th of Feb 2023
    // replace with new Date() for true today
    const today = new Date(2023, 1, 10) // actually today: const today = new Date()

    const auditDueDates = d3.index(auditDataRaw
        .filter(d => d.auditId.includes("eeg2009")) // this line filters exclusively for 2009 EEG, comment out for all types
        .map(d => {
            const [day, month, year] = d.dueDateAudit.split(" ")[0].split(".")
            return {
                auditId: d.auditId,
                dueDate: isNaN(year) === false ? new Date(year, month-1, day) : null
            }
        })
        .filter(d => d.dueDate !== null)
        , d => d.auditId)

    const worklogData = worklogDataRaw
        .map(d => {
            const [day, month, year] = d.doneAt.split(" ")[0].split(".")
            return {
                ...d,
                workstep: steps.get(d.workstep),
                doneAt: isNaN(year) === false ? new Date(year, month-1, day) : null
            }
        })

    // we have the problem of seasonal work -- if we assume e.g. that audits are done 6 weeks prior to due date, we'll have a spike of "audits to do" for all 800 clients.
    // to circumvent this, we'll analyse the past, assuming that humans will human; we will render past data in a form that allows us to get an answer to the question:
    // "across all past audits of type EEG 2009, that were progressed to VB II 12 weeks out from due date, when did the progression to "audit" take place?"
    // there will be a distribution of some kind which we will then sample for the current audits to predict when the audit will take place.

    // function to calculate a status progression out of a worklog array
    const processLogs = (worklogArray) => {
        // we sort by workstep id first and then by date
        // so should e.g. step 2 and 3 be done on the same date, we assume they were done in logical order
        const sorted = worklogArray
            .filter(d => d.doneAt !== null && d.doneAt <= today) // get rid of all steps with unknown doneAt date
            .sort((a, b) => a.workstep.id - b.workstep.id)
            .sort((a, b) => a.doneAt - b.doneAt)

        if (sorted.length === 0) return []

        // make a map of the earliest occurences of all listed steps
        const worklogMap = new d3.rollup(sorted,
            D => d3.min(D.map(d => d.doneAt)),
            d => d.workstep.stepName
        )

        // define hurdles == hurdles are steps after which the status will not be moved back
        // so e.g. even when there is an instance of "NB I" done after "Fertigstellung", it will have no effect on the status progression
        // this emulates the status calculation in the application itself
        // at least if I remember correctly
        const hurdleStepNames = [
            "Tourenplanung", "VB II", "Termin", "NB I", "Fertigstellung", "Prüfung", "Freigabe", "Versand", "Rechnung", "Zahlung"
        ]

        const hurdleWorklogs = sorted.filter(worklog => hurdleStepNames.includes(worklog.workstep.stepName))

        // loop through and increase date if below previous
        let previousDate = null
        let cleanedInconsistentTimeline = false
        const timeline = new d3.InternMap(hurdleStepNames.filter(hurdleStepName => worklogMap.has(hurdleStepName)) // relevantHurdles in order
            .map(hurdleStepName => {
                if (worklogMap.get(hurdleStepName) > previousDate) {
                    previousDate = worklogMap.get(hurdleStepName)
                } else if (worklogMap.get(hurdleStepName) < previousDate) {
                    cleanedInconsistentTimeline = true
                }
                return [hurdleStepName, previousDate]
            }))

        // everything else is just contacting the client
        const contactWorklogs = sorted.filter(worklog => hurdleStepNames.includes(worklog.workstep.stepName) === false)

        // get VB Is: before Tourenplanung
        const VBIMatches = contactWorklogs.filter(worklog => worklog.doneAt <= worklogMap.get("Tourenplanung"))
        if (VBIMatches.length) {
            timeline.set("VB I", d3.min(VBIMatches, d => d.doneAt))
        }

        // VB I done between set audit date and audit counts as VB II
        const VBIIMatches = contactWorklogs.filter(worklog => worklog.date >= worklogMap.get("Tourenplanung") &&  worklog.date <= worklogMap.get("Termin"))
        if (VBIIMatches.length) {
            const earliestMatch = d3.min(VBIIMatches, d => d.doneAt)
            if (worklogMap.has("VB II")) {
                timeline.set("VB II", d3.min([worklogMap.get("VB II"), earliestMatch]))
            } else {
                timeline.set("VB II", earliestMatch)
            }
        }

        const NBIIMatches = contactWorklogs.filter(worklog => worklog.date >= worklogMap.get("NB I") && worklog.date <= worklogMap.get("Fertigstellung"))
        if (NBIIMatches.length) {
            timeline.set("NB II", d3.min(NBIIMatches, d => d.date))
        }

        // we're not sorting anything. we're frankensteining this together
        const finalArray = 	[
            "VB I",
            "Tourenplanung",
            "VB II",
            "Termin",
            "NB I",
            "NB II",
            "Fertigstellung",
            "Prüfung",
            "Freigabe",
            "Versand",
            "Rechnung",
            "Zahlung"
        ].map(stepName => [stepName, timeline.get(stepName)])
        .filter(stepAndDateTuple => !!stepAndDateTuple[1])

        let from = "Beginn"
        const statusProgression = finalArray.map(worklog => {
            const [stepName, doneAt] = worklog
            const returnObj = { from, to: stepName, date: doneAt }
            from = stepName
            return returnObj
        })

        statusProgression.forEach((worklog, index) => {
            if (index !== finalArray.length - 1) {
                const daysTillNextStatus = Math.round((statusProgression[index+1].date - worklog.date) / (1000 * 24 * 60 * 60));
                worklog["daysTillNextStatus"] = daysTillNextStatus;
            }
        })

        const completeProgression = finalArray.length === 14
        return { statusProgression, completeProgression, worklogArray: finalArray, cleanedInconsistentTimeline, currentStatus: statusProgression[statusProgression.length - 1]?.to }
    }

    const groupedByAuditId = d3.rollup(worklogData, D => processLogs(D), d => d.auditId)

    // we want to limit the reference data to elements with last status being at least "Rechnung"
    const relevantEntries = Array.from(groupedByAuditId.entries()).filter(([key, value]) => {
        const hasDueDate = auditDueDates.has(key)
        if (!hasDueDate) return false
        if (["Rechnung", "Zahlung"].includes(value.currentStatus) === false) return false
        // let's filter for reference year >= 2020, too
        const referenceYear = Number(key.split("_")[0])
        if (referenceYear < 2020) return false
        return true
    })
        .map(D => {
            const [auditId, dataObj] = D
            const referenceYear = Number(auditId.split("_")[0])
            const auditType = auditId.split("_")[3]
            const dueDate = auditDueDates.get(auditId).dueDate
            dataObj.statusProgression.forEach(status => {
                const daysTillDueDate = Math.round((dueDate - status.date) / (1000 * 60 * 60 * 24))
                status["daysTillDueDate"] = daysTillDueDate
            })
            return { ...dataObj, referenceYear, auditType, dueDate }
        }) // add in audit type key and due date

    const itemsPerAuditType = d3.group(relevantEntries, d => d.auditType)

    // the canvas is clientSizing - margins
    const margin = { top: 20, left: 40, bottom: 30, right: 30}
    const plotHeight = clientHeight / 2 - margin.bottom - margin.top
    const plotWidth = clientWidth - margin.left - margin.right
    // visualize the relationship between "daysTillDueDate" and "daysTillNextStatus", and what the next status is
    const svgs = d3.select("body").selectAll("svg.distribution")
        .data(itemsPerAuditType)
        .enter()
        .append("svg")
        .attr("class", "distribution")
        .attr("id", d => d[0])
        .attr("width", clientWidth)
        .attr("height", plotHeight)


    svgs.each(function (datum) {
        const [key, value] = datum
        const currentSVG = d3.select(this)

        const canvas = currentSVG
            .append("g")
            .attr("class", "canvas")
            .attr("transform", `translate(${margin.left}, ${margin.top})`)

        const axes = currentSVG
            .append("g")
            .attr("class", "axes")

        const condensedValues = value.map(d => d.statusProgression).flat()
        const extentYAxis = d3.extent(condensedValues, d => d.daysTillDueDate)
        const extentXAxis = d3.extent(condensedValues, d => d.daysTillNextStatus)

        const xScale = d3.scaleLinear().domain([-100, 400]).range([0, clientWidth - margin.left - margin.right])
        const yScale = d3.scaleLinear().domain([-100, 300]).range([plotHeight, 0])
        xScale.clamp(true)
        yScale.clamp(true)

        const xAxis = axes
            .append("g")
            .attr("class", "x axis")
            .attr("transform", `translate(${margin.left}, ${yScale(0) + margin.top})`)
            .call(d3.axisBottom(xScale))

        const yAxis = axes
            .append("g")
            .attr("class", "y axis")
            .attr("transform",  `translate(${margin.left + xScale(0)}, ${margin.top})`)
            .call(d3.axisLeft(yScale))

        const textXAxis = xAxis
            .append("text")
            .text("Days until next step")
            .attr("class", "axis-title")
            .attr("transform",  `translate(${plotWidth / 2}, ${margin.bottom - 5})`)

        const textYAxis = yAxis
            .append("text")
            .text("Days until due date of audit")
            .attr("class", "axis-title")
            .attr("transform",  `translate(${-40}, ${(plotHeight / 2)}) rotate(-90)`)

        const colorForSteps = d3.scaleSequential(d3.interpolateRdYlGn).domain([0, stepsRaw.length])
        const groupByStepFrom = d3.rollup(condensedValues, D => D, d => d.from)

        const rectGroups = canvas
            .selectAll("g")
            .data(groupByStepFrom)
            .enter()
            .append("g")
            .attr("class", d => d[0])
            .attr("fill", d => colorForSteps(steps.get(d[0]).id))

        const circles = rectGroups.selectAll("circle")
            .data(d => d3.flatRollup(d[1], D => D.length, d => d.daysTillNextStatus, d => d.daysTillDueDate))
            .enter()
            .append("circle")
            .attr("r", 2)
            .attr("cx", d => xScale(d[0]))
            .attr("cy", d => yScale(d[1]))
    })

    // now we're gonna do the whole bunch of "how many hours do we actually have"
    const renderAvailableResources = async () => {

        const dateStringToDate = (dateString) => {
            const [day, month, year] = dateString.split(".").map(digit => Number(digit))
            return new Date(year, month-1, day)
        }

        const workschemesRaw = await d3.tsv("./workschemes.tsv")
        const absencesRaw = await d3.tsv("./absences.tsv")
        const absences = absencesRaw.map(absence => {
            return {
                ...absence,
                from: dateStringToDate(absence.from),
                to: dateStringToDate(absence.to),
            }
        })
        const absencesPerPerson = d3.group(absences, d => d.name)

        const personAbsentOnDate = (name, date) => {
            if (!date) throw Error("invalid date")
            if (absencesPerPerson.has(name) === false) return false
            return absencesPerPerson.get(name).filter(absence => absence.from <= date && absence.to >= date).length > 0
        }

        const teams = d3.union(workschemesRaw.map(d => d.Team))
        const workschemes = workschemesRaw.map(d => {
            return {
                name: d.name,
                Team: d.Team,
                Monday: parseFloat(d.Monday | 0),
                Tuesday: parseFloat(d.Tuesday | 0),
                Wednesday: parseFloat(d.Wednesday | 0),
                Thursday: parseFloat(d.Thursday | 0),
                Friday: parseFloat(d.Friday | 0),
                Saturday: parseFloat(d.Saturday | 0),
                Sunday: parseFloat(d.Sunday | 0),
                validFrom: new Date(dateStringToDate(d.validFrom).setHours(0,0,0,0)),
                validTo: !!d.validTo ?
                    new Date(dateStringToDate(d.validTo).setHours(23,59,59,999))
                    : new Date(new Date().setHours(23,59,59,999)) // if it's null set to today
            }
        })

        const timeframe = [d3.min(workschemes, d => d.validFrom), d3.max(workschemes, d => d.validTo)]

        // let's make a canvas first
        const svg = d3.select("body")
            .append("svg")
            .attr("id", "available-resources")
            .attr("width", clientWidth)
            .attr("height", clientHeight / 2)

        // we want a graph spanning the entire frame of worklog schemes info
        // const xScaleAvailableResources = d3.scaleTime().domain

        const canvas = svg
            .append("g")
            .attr("class", "canvas")
            .attr("width", plotWidth)
            .attr("height", plotHeight)
            .attr("transform", `translate(${margin.left}, ${margin.top})`)

        const axesGroup = svg
            .append("g")
            .attr("class", "axes")
            .attr("transform", `translate(${margin.left}, ${margin.top})`)

        // constructing a time scale we will shoehorn into weeks at will
        const minDate = new Date(2021, 11, 1)
        const maxDate = new Date()

        const mode = "timeMonday"
        const weeks = d3[mode].every(1).range(minDate, maxDate)
        const xScale = d3.scaleTime()
            .domain([minDate, maxDate])
            .range([0, clientWidth - margin.left - margin.right])

        // range for colors is 0,1
        const color = d3.scaleSequential(d3.interpolateViridis).domain([0, teams.size-1]);

        const generateHolidaysForYears = (yearArr = [new Date().getFullYear()]) => {
            // first, the fixed dates
            const fixedHolidays = yearArr.map(year => {
                return [
                    new Date(year, 0, 1), // Neujahr
                    new Date(year, 0, 6), // Hl. 3 Könige
                    new Date(year, 4, 1), // Tag der Arbeit
                    new Date(year, 7, 15), // Mariä Himmelfahrt
                    new Date(year, 9, 3), // Tag der dt. Einheit
                     new Date(year, 10, 1), // Allerheiligen
                    new Date(year, 11, 25), // 1. Weihnachtsfeiertag
                    new Date(year, 11, 26), // 2. Weihnachtsfeiertag
                ]
            })

            const movingHolidaysForYear = (year) => {
                const f = Math.floor,
                // Golden Number - 1
                G = year % 19,
                C = f(year / 100),
                // related to Epact
                H = (C - f(C / 4) - f((8 * C + 13)/25) + 19 * G + 15) % 30,
                // number of days from 21 March to the Paschal full moon
                I = H - f(H/28) * (1 - f(29/(H + 1)) * f((21-G)/11)),
                // weekday for the Paschal full moon
                J = (year + f(year / 4) + I + 2 - C + f(C / 4)) % 7,
                // number of days from 21 March to the Sunday on or before the Paschal full moon
                L = I - J,
                month = 3 + f((L + 40)/44),
                day = L + 28 - 31 * f(month / 4);
	            return [
                        // new Date(year, month-1, day - 3), // Gründonnerstag
                        new Date(year, month-1, day - 2), // Karfreitag
                        new Date(year, month-1, day), // Ostersonntag
                        new Date(year, month-1, day + 1), // Ostermontag
                        new Date(year, month-1, day + 39), // Christi Himmelfahrt
                        new Date(year, month-1, day + 49), // Pfingstsonntag
                        new Date(year, month-1, day + 50), // Pfingstmontag
                        new Date(year, month-1, day + 60) // Fronleichnam
                    ]
            }

            const movingHolidays = yearArr.map(year => movingHolidaysForYear(year))
            return [...fixedHolidays.flat(), ...movingHolidays.flat()]
        }
        const yearsInTimeframe = (minDate, maxDate) => {
            const startYear = minDate.getFullYear()
            const endYear = maxDate.getFullYear()
            return Array(endYear - startYear + 1).fill(0).map((_, i) => startYear + i)
        }
        const holidaysInTimeframe = d3.index(generateHolidaysForYears(yearsInTimeframe(minDate, maxDate)).sort((a, b) => a - b), d => d)

        const workersWorkingOnDate = (date) => workschemes
            .filter(workscheme => workscheme.validFrom <= date && workscheme.validTo >= date)
            .filter(workscheme => personAbsentOnDate(workscheme.name, date) === false)             // remove all that are absent

        const getWorkerHoursForDate = (date) => {
            if (holidaysInTimeframe.has(date)) return []
            const dayName = date.toLocaleDateString("en-GB", { weekday: "long" })

            const contractHours = workersWorkingOnDate(date)
                .map(worker => {
                    return { date, name: worker.name, dayName, hours: worker[dayName], team: worker.Team }
                }).filter(worker => worker.hours > 0)

            return contractHours
        }

        const getWorkerHoursForTimeframe = (startDate, endDate) => {
            const days = d3.timeDay.every(1).range(startDate, endDate)
            return days.map(day => getWorkerHoursForDate(day)).filter(dayResult => dayResult.length > 0).flat()
        }

        const allWorklogs = getWorkerHoursForTimeframe(minDate, maxDate)
        const stacking = d3.stack()
            .keys(teams)
            .value(([, item], key) => item ? item : 0)

        let maxResources = 0
        const hoursByWeekAndTeam = weeks
            .slice(0, -1)
            .map((week, index) => {
                const individualHours = getWorkerHoursForTimeframe(week, new Date(weeks[index+1]-1))
                const groupedByTeam = d3.rollup(individualHours, D => d3.sum(D.map(d => d.hours)), d => d.team)
                let runningSum = 0
                for (const team of teams) {
                    if (groupedByTeam.has(team)){
                        const value = groupedByTeam.get(team)
                        groupedByTeam.set(team, { value, startStack: runningSum, endStack: runningSum + value })
                        runningSum += value
                    } else {
                        groupedByTeam.set(team, { value: 0, startStack: runningSum, endStack: runningSum })
                    }
                }
                if (maxResources < runningSum)
                    maxResources = runningSum
                return [ week, groupedByTeam]
            })

        const xAxis = axesGroup
            .append("g")
            .attr("class", "x axis")
            .attr("transform", `translate(0, ${plotHeight})`)
            .call(d3.axisBottom(xScale))

        const yScale = d3.scaleLinear().domain([0, maxResources]).range([plotHeight, 0])

        const yAxis = axesGroup.append("g")
            .attr("class", "y axis")
            .call(d3.axisLeft(yScale))


        const paths = canvas.selectAll("g")
            .data(teams)
            .enter()
            .append("g")
            .attr("class", d => d)
                .append("path")

        paths.each(function (teamName, index) {
            const areaGenerator = d3.area()
                .x(d => xScale(d[0]))
                .y0(d => yScale(d[1].get(teamName).startStack))
                .y1(d =>yScale(d[1].get(teamName).endStack))
                .curve(d3.curveStep)

            d3.select(this).datum(hoursByWeekAndTeam).attr("d", d => areaGenerator(d)).attr("fill", color(index))
        })
    }

    await renderAvailableResources()

</script>
</body>
</html>
