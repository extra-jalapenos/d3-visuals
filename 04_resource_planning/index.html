<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Planning</title>
    <link rel="stylesheet" href="base.css">
    <script type="module" src="./index.js"></script>
</head>
<body>
<script type="module">
    import { loadSteps } from "../00_constants/steps.js"
    import { processLogs } from "../00_constants/auditStatusProgression.js"
    import { indexAuditDueDates } from "../00_constants/auditDueDate.js"
    import { cleanWorklogData } from "../00_constants/worklog.js"
    import { teams, getWorkerHoursForTimeframe } from "./estimated-resources.js"
    import { fabricateWorkerHours } from "./fabricateResources.js"
    import { getPointsByDate } from "./accumulatedPoints.js";

    // for FULL view!
    const clientWidth = document.documentElement.clientWidth
    const clientHeight = document.documentElement.clientHeight

    const body = d3.select("body")
        .attr("width", clientWidth)
        .attr("height", clientHeight)
        .attr("viewBox", `0, 0, ${clientWidth}, ${clientHeight}`)
        .attr("preserveAspectRatio", "none")

	// the canvas is clientSizing - margins
	const margin = { top: 20, left: 50, bottom: 30, right: 50}
	const plotHeight = clientHeight / 2 - margin.bottom - margin.top
	const plotWidth = clientWidth - margin.left - margin.right

    // now we're gonna do the whole bunch of "how many hours do we actually have"
    const renderAvailableResources = async (startDate, endDate) => {
        // const today = new Date(2025, 11, 2)
        if (!startDate | !endDate) throw Error("no timeframe given")

        const typeOfViews = [ "Theoretical Resources", "Factual Resources" ]
        // const timeframe = [d3.min(workschemes, d => d.validFrom), d3.max(workschemes, d => d.validTo)] // alternate approach to just show the entire breadth of worker hours

        // let's make a canvas first for each view
        const svg = d3.select("body").selectAll("svg")
            .data(typeOfViews)
            .enter()
            .append("svg")
            .attr("id", d => d)
            .attr("width", clientWidth)
            .attr("height", clientHeight / 2)

        const canvas = svg
            .append("g")
            .attr("class", "canvas")
            .attr("width", plotWidth)
            .attr("height", plotHeight)
            .attr("transform", `translate(${margin.left}, ${margin.top})`)

        const axesGroup = svg
            .append("g")
            .attr("class", "axes")
            .attr("transform", `translate(${margin.left}, ${margin.top})`)

        const mode = "timeMonday" // timeDay for daily resolution, timeMonday for weeks, timeMonth for months
        const timeSlots = d3[mode].every(1).range(startDate, endDate)

        const xScale = d3.scaleTime()
            .domain([startDate, endDate])
            .range([0, clientWidth - margin.left - margin.right])

        // range for colors is 0,1
        const color = d3.scaleSequential(d3.interpolateViridis).domain([0, teams.size-1])

        let maxResources = 0
        const hoursBySlotAndTeam = timeSlots
            .slice(0, -1)
            .map((timeSlot, index) => {
                const individualIdealHours = getWorkerHoursForTimeframe(timeSlot, new Date(timeSlots[index+1]-1))
                const individualFactualHours = fabricateWorkerHours(timeSlot, new Date(timeSlots[index+1]-1), today)

                const idealHoursGroupedByTeam = d3.rollup(individualIdealHours, D => d3.sum(D.map(d => d.hours)), d => d.team)
                let runningSum = 0
                for (const team of teams) {
                    if (idealHoursGroupedByTeam.has(team)) {
                        const value = idealHoursGroupedByTeam.get(team)
                        idealHoursGroupedByTeam.set(team, { value, startStack: runningSum, endStack: runningSum + value })
                        runningSum += value
                    } else {
                        idealHoursGroupedByTeam.set(team, { value: 0, startStack: runningSum, endStack: runningSum })
                    }
                }
                if (maxResources < runningSum)
                    maxResources = runningSum

                const individualFactualHoursGroupedByTeam = d3.rollup(individualFactualHours, D => d3.sum(D.map(d => d.hours)), d => d.team)
                runningSum = 0
                for (const team of teams) {
                    if (individualFactualHoursGroupedByTeam.has(team)) {
                        const value = individualFactualHoursGroupedByTeam.get(team)
                        individualFactualHoursGroupedByTeam.set(team, { value, startStack: runningSum, endStack: runningSum + value })
                        runningSum += value
                    } else {
                        individualFactualHoursGroupedByTeam.set(team, { value: 0, startStack: runningSum, endStack: runningSum })
                    }
                }

                runningSum = 0
                const individualDifferenceGroupedByTeam = d3.rollup(individualFactualHours, D => d3.sum(D.map(d => d.hours)), d => d.team)
                for (const team of teams) {
                    if (individualDifferenceGroupedByTeam.has(team)) {
                        const factValue = individualDifferenceGroupedByTeam.get(team)
                        const shouldBeValue = idealHoursGroupedByTeam.has(team) ? idealHoursGroupedByTeam.get(team).value : 0
                        individualDifferenceGroupedByTeam.set(team, { value: factValue - shouldBeValue, startStack: runningSum, endStack: runningSum + factValue - shouldBeValue })
                        runningSum = runningSum + factValue - shouldBeValue
                    } else {
                        individualDifferenceGroupedByTeam.set(team, { value: 0, startStack: runningSum, endStack: runningSum })
                    }
                }

                if (maxResources < runningSum)
                    maxResources = runningSum

                return [
                    timeSlot,
                    new Date(timeSlots[index+1]-1),
                    idealHoursGroupedByTeam,
                    individualFactualHoursGroupedByTeam,
                    individualDifferenceGroupedByTeam
                ]
            })


        const xAxis = axesGroup
            .append("g")
            .attr("class", "x axis")
            .attr("transform", `translate(0, ${plotHeight})`)
            .call(d3.axisBottom(xScale))

        const yScale = d3.scaleLinear().domain([0, maxResources]).range([plotHeight, 0])

        const points = await getPointsByDate(startTimeFrame, endTimeFrame, today)
        const pointsByWeek = d3.rollup(points, D => d3.sum(D.map(d => d[1])), d => timeSlots.find(el => el >= d[0]))

        const secondaryYScale = d3.scaleLinear().domain([0, d3.max(pointsByWeek, d => d[1])]).range([plotHeight, 0])
        const lineGenerator = d3.line()
            .x(d => xScale(d[0]))
            .y(d => secondaryYScale(d[1]))
            .curve(d3.curveStep)

        const yAxis = axesGroup.append("g")
            .attr("class", "y axis")
            .call(d3.axisLeft(yScale))

        const secondaryYAxis = axesGroup.append("g")
            .attr("class", "y axis")
            .attr("transform", `translate(${plotWidth}, 0)`)
            .call(d3.axisRight(secondaryYScale))

        svg.each(function (type, typeIndex) {
            const canvas = d3.select(this).select("g.canvas")

            const teamGroups = canvas.selectAll("g")
                .data(teams)
                .enter()
                .append("g")
                .attr("class", d => d)

            teamGroups.each(function (teamName, teamIndex) {
            const areaGenerator = d3.area()
                .x(d => xScale(d[0]))
                .y0(d => yScale(d[2 + typeIndex].get(teamName).startStack))
                .y1(d =>yScale(d[2 + typeIndex].get(teamName).endStack))
                .curve(d3.curveStep)

            d3.select(this).selectAll("rect")
                .data(hoursBySlotAndTeam)
                .enter()
                .append("rect")
                .attr("class", d => {
                    if (d[1] < today) return "past"
                    if (d[0] > today) return "future"
                    return "current"
                })
                .attr("fill", color(teamIndex))
                .attr("x", d => xScale(d[0]))
                .attr("y", d => yScale(d[2 + typeIndex].get(teamName).endStack))
                .attr("width", d => xScale(d[1]) - xScale(d[0]))
                .attr("height", d => yScale(d[2 + typeIndex].get(teamName).startStack) - yScale(d[2 + typeIndex].get(teamName).endStack))

            const circlesGroup = canvas.append("g")
                .attr("class", "points")

                const circles = circlesGroup.selectAll("circle")
                    .data(pointsByWeek)
                    .enter()
                    .append("circle")
                    .attr("cx", d => xScale(d[0]))
                    .attr("cy", d => secondaryYScale(d[1]))
                    .attr("r", 2)
            })

        })

        const plotPoints = async () => {
            const svg = body
                .append("svg")
                .attr("class", "points")
                .attr("width", clientWidth)
                .attr("height", clientHeight)

            const canvas = svg
                .append("g")
                .attr("class", "canvas")
                .attr("width", plotWidth)
                .attr("height", plotHeight)
                .attr("transform", `translate(${margin.left}, ${margin.top})`)

            const SecondaryYScale = d3.scaleLinear([0, d3.max(points, d => d[1])], [plotHeight, 0])

        }

        await plotPoints()
    }
    const currentYear = new Date().getFullYear()
    const today = new Date(2023, 7, 10)
    const startTimeFrame = new Date(2023, 0, 1), endTimeFrame = new Date(2024, 11, 31)
    await renderAvailableResources(startTimeFrame, endTimeFrame)

</script>
</body>
</html>
